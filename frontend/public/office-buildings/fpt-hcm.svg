    <rect x="28" y="46" width="3" height="3" />
    <rect x="34" y="46" width="3" height="3" fill="#fbbf24" />
    <rect x="40" y="46" width="3" height="3" />
    <rect x="46" y="46" width="3" height="3" fill="#fbbf24" />
    <rect x="52" y="46" width="3" height="3" />

    <rect x="10" y="52" width="3" height="3" />
    <rect x="16" y="52" width="3" height="3" fill="#fbbf24" />
