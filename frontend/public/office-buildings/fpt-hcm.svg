  <!-- FPT label stripe (top) -->
  <rect x="6" y="14" width="52" height="6" fill="#dc2626" />
  <text x="32" y="19" font-family="Arial, sans-serif" font-size="5" font-weight="900" fill="white" text-anchor="middle">FPT</text>

  <!-- Chimney/antenna -->
  <line x1="14" y1="14" x2="14" y2="6" stroke="#134e4a" stroke-width="1.5" />
  <circle cx="14" cy="5" r="1.5" fill="#fbbf24" />
