    <rect x="10" y="58" width="3" height="3" fill="#fbbf24" />
    <rect x="16" y="58" width="3" height="3" />
    <rect x="22" y="58" width="3" height="3" fill="#fbbf24" />
    <rect x="28" y="58" width="3" height="3" />
    <rect x="34" y="58" width="3" height="3" fill="#fbbf24" />
