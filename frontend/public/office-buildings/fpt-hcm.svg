    <rect x="46" y="34" width="3" height="3" fill="#fbbf24" />
    <rect x="52" y="34" width="3" height="3" />

    <rect x="10" y="40" width="3" height="3" />
    <rect x="16" y="40" width="3" height="3" fill="#fbbf24" />
