<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" fill="none">
  <defs>
    <linearGradient id="hn-tower" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="hn-shadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Base platform -->
  <rect x="2" y="72" width="60" height="6" rx="1" fill="#475569" />
  <rect x="0" y="76" width="64" height="3" fill="#334155" />

  <!-- Tall central tower (signature of Hanoi) -->
  <rect x="22" y="6" width="20" height="66" fill="url(#hn-tower)" />
  <rect x="22" y="6" width="20" height="66" fill="url(#hn-shadow)" />

  <!-- Windows (center) -->
  <g fill="#fef3c7" opacity="0.9">
