    <rect x="37" y="16" width="3" height="3" />
    <rect x="25" y="22" width="3" height="3" fill="#fbbf24" />
    <rect x="31" y="22" width="3" height="3" />
    <rect x="37" y="22" width="3" height="3" fill="#fbbf24" />
