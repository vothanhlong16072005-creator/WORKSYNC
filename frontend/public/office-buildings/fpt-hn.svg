    <rect x="37" y="28" width="3" height="3" />
    <rect x="25" y="34" width="3" height="3" fill="#fbbf24" />
    <rect x="31" y="34" width="3" height="3" />
    <rect x="37" y="34" width="3" height="3" fill="#fbbf24" />
    <rect x="25" y="40" width="3" height="3" />
