  <!-- Antenna -->
  <line x1="32" y1="6" x2="32" y2="0" stroke="#7f1d1d" stroke-width="1.5" />
  <circle cx="32" cy="0" r="1.5" fill="#fbbf24" />

  <!-- FPT label stripe -->
  <rect x="22" y="0" width="20" height="6" fill="#dc2626" />
  <text x="32" y="5" font-family="Arial, sans-serif" font-size="5" font-weight="900" fill="white" text-anchor="middle">FPT</text>
